name: Update PSG Widget

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate widget
        env:
          API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
        run: bash update.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update PSG widget $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
