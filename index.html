<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: https://azure.assets.harvey.ai; connect-src 'none'; webrtc 'block'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    color: #e0e0e0;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    display: flex;
    justify-content: center;
    padding: 4px;
  }
  .widget { max-width: 340px; width: 100%; }
  .match { margin-bottom: 10px; }
  .date {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-bottom: 4px;
    text-transform: capitalize;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90px;
  }
  .team img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    margin-bottom: 2px;
  }
  .team-name {
    font-size: 10px;
    color: #bbb;
    text-align: center;
    line-height: 1.2;
  }
  .score {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    min-width: 50px;
    text-align: center;
    letter-spacing: 2px;
  }
  .kickoff {
    font-size: 16px;
    font-weight: 600;
    color: #ccc;
    min-width: 50px;
    text-align: center;
  }
  .scorers {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 3px;
  }
  .scorers-side {
    font-size: 9px;
    color: #888;
    line-height: 1.4;
    max-width: 120px;
  }
  .scorers-home { text-align: right; }
  .scorers-away { text-align: left; }
  .separator {
    border: none;
    border-top: 1px solid #333;
    margin: 8px 40px;
  }
  .error { color: #c66; font-size: 11px; text-align: center; padding: 10px; }
  .loading { color: #666; font-size: 11px; text-align: center; padding: 10px; }
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="loading">Chargement…</div>
</div>
<script>
(function() {
  // ================================================================
  // REMPLACEZ ci-dessous par votre clé API football-data.org (gratuite)
  // Inscription : https://www.football-data.org/client/register
  // ================================================================
  var API_KEY = 'a103b84bf77d4d4d975629d3614b5044';

  var TEAM_ID = 524; // Paris Saint-Germain
  var BASE = 'https://api.football-data.org/v4';
  // Ligue 1 : code « FL1 » ou id 2015 selon la version de l'API
  var COMPETITION = 'FL1';

  // ---- Formatage des dates en français ----
  function formatDate(iso) {
    var d = new Date(iso);
    return d.toLocaleDateString('fr-FR', {
      weekday: 'short',
      day: 'numeric',
      month: 'short',
      timeZone: 'Europe/Paris'
    });
  }

  function formatTime(iso) {
    var d = new Date(iso);
    return d.toLocaleTimeString('fr-FR', {
      hour: '2-digit',
      minute: '2-digit',
      timeZone: 'Europe/Paris'
    });
  }

  // ---- Utilitaires ----
  function esc(s) {
    if (s == null) return '';
    var el = document.createElement('span');
    el.textContent = String(s);
    return el.innerHTML;
  }

  function isPSG(match) {
    return (match.homeTeam && match.homeTeam.id === TEAM_ID) ||
           (match.awayTeam && match.awayTeam.id === TEAM_ID);
  }

  function fetchJSON(url) {
    return fetch(url, {
      headers: { 'X-Auth-Token': API_KEY }
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // ---- Récupération des matchs via l'endpoint compétition (free tier) ----
  function fetchCompetitionMatches(status, limit) {
    var url = BASE + '/competitions/' + COMPETITION + '/matches?status=' + status + '&limit=' + limit;
    return fetchJSON(url).catch(function() {
      // Fallback : essayer avec l'id numérique 2015
      var url2 = BASE + '/competitions/2015/matches?status=' + status + '&limit=' + limit;
      return fetchJSON(url2);
    });
  }

  function findLastPSGMatch(data) {
    if (!data || !data.matches) return null;
    // Filtrer les matchs du PSG, trier par date décroissante, prendre le plus récent
    var psgMatches = data.matches.filter(isPSG);
    if (!psgMatches.length) return null;
    psgMatches.sort(function(a, b) {
      return new Date(b.utcDate) - new Date(a.utcDate);
    });
    return psgMatches[0];
  }

  function findNextPSGMatch(data) {
    if (!data || !data.matches) return null;
    var psgMatches = data.matches.filter(isPSG);
    if (!psgMatches.length) return null;
    psgMatches.sort(function(a, b) {
      return new Date(a.utcDate) - new Date(b.utcDate);
    });
    return psgMatches[0];
  }

  // ---- Buteurs ----
  function fetchGoals(matchId) {
    return fetchJSON(BASE + '/matches/' + matchId).then(function(data) {
      return data.goals || [];
    }).catch(function() {
      return [];
    });
  }

  function buildScorers(goals, teamId) {
    if (!goals || !goals.length) return '';
    var items = goals.filter(function(g) {
      return g.team && g.team.id === teamId && g.scorer;
    }).map(function(g) {
      var name = g.scorer.name.split(' ').pop();
      return esc(name) + (g.minute ? " <span style='color:#666'>" + g.minute + "'</span>" : '');
    });
    return items.join('<br>');
  }

  // ---- Rendu ----
  function render(last, lastGoals, next) {
    var html = '';

    if (last) {
      var m = last;
      html += '<div class="match">';
      html += '<div class="date">' + esc(formatDate(m.utcDate)) + '</div>';
      html += '<div class="row">';
      html += '<div class="team">';
      if (m.homeTeam.crest) html += '<img src="' + esc(m.homeTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(m.homeTeam.shortName || m.homeTeam.tla || m.homeTeam.name) + '</span>';
      html += '</div>';
      html += '<div class="score">' + m.score.fullTime.home + ' – ' + m.score.fullTime.away + '</div>';
      html += '<div class="team">';
      if (m.awayTeam.crest) html += '<img src="' + esc(m.awayTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(m.awayTeam.shortName || m.awayTeam.tla || m.awayTeam.name) + '</span>';
      html += '</div>';
      html += '</div>';

      // Buteurs
      var homeSc = buildScorers(lastGoals, m.homeTeam.id);
      var awaySc = buildScorers(lastGoals, m.awayTeam.id);
      if (homeSc || awaySc) {
        html += '<div class="scorers">';
        html += '<div class="scorers-side scorers-home">' + (homeSc || '&nbsp;') + '</div>';
        html += '<div class="scorers-side scorers-away">' + (awaySc || '&nbsp;') + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    if (last && next) {
      html += '<hr class="separator">';
    }

    if (next) {
      var n = next;
      html += '<div class="match">';
      html += '<div class="date">' + esc(formatDate(n.utcDate)) + '</div>';
      html += '<div class="row">';
      html += '<div class="team">';
      if (n.homeTeam.crest) html += '<img src="' + esc(n.homeTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(n.homeTeam.shortName || n.homeTeam.tla || n.homeTeam.name) + '</span>';
      html += '</div>';
      html += '<div class="kickoff">' + esc(formatTime(n.utcDate)) + '</div>';
      html += '<div class="team">';
      if (n.awayTeam.crest) html += '<img src="' + esc(n.awayTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(n.awayTeam.shortName || n.awayTeam.tla || n.awayTeam.name) + '</span>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
    }

    if (!last && !next) {
      html = '<div class="error">⚠ Impossible de charger les données</div>';
    }

    document.getElementById('widget').innerHTML = html;
  }

  // ---- Chargement principal ----
  function loadData() {
    Promise.all([
      fetchCompetitionMatches('FINISHED', 15).catch(function() { return null; }),
      fetchCompetitionMatches('SCHEDULED', 15).catch(function() { return null; })
    ]).then(function(results) {
      var lastMatch = findLastPSGMatch(results[0]);
      var nextMatch = findNextPSGMatch(results[1]);

      // Si on a un dernier match, récupérer les buteurs via le détail du match
      if (lastMatch && lastMatch.id) {
        fetchGoals(lastMatch.id).then(function(goals) {
          render(lastMatch, goals, nextMatch);
        });
      } else {
        render(lastMatch, [], nextMatch);
      }
    }).catch(function() {
      document.getElementById('widget').innerHTML =
        '<div class="error">⚠ Impossible de charger les données</div>';
    });
  }

  // ---- Rafraîchissement automatique à midi et minuit (heure de Paris) ----
  function msUntilNextRefresh() {
    var now = new Date();
    var paris = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
    var h = paris.getHours(), m = paris.getMinutes(), s = paris.getSeconds();
    var totalSec = h * 3600 + m * 60 + s;
    var noon = 43200;    // 12:00:00
    var midnight = 86400; // 00:00:00 du lendemain
    var secUntilNoon = noon - totalSec;
    var secUntilMidnight = midnight - totalSec;
    if (secUntilNoon > 30) return secUntilNoon * 1000;
    if (secUntilMidnight > 30) return secUntilMidnight * 1000;
    return midnight * 1000; // fallback : dans 24 h
  }

  function scheduleRefresh() {
    var ms = msUntilNextRefresh();
    setTimeout(function() {
      loadData();
      scheduleRefresh();
    }, ms);
  }

  // Démarrage
  loadData();
  scheduleRefresh();
})();
</script>
</body>
</html>
