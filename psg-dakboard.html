<!DOCTYPE html>
<html lang="fr">
<head>
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data: https://azure.assets.harvey.ai; connect-src 'none'; webrtc 'block'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSG</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    color: #e0e0e0;
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    display: flex;
    justify-content: center;
    padding: 4px;
  }
  .widget { max-width: 340px; width: 100%; }
  .match { margin-bottom: 10px; }
  .date {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin-bottom: 4px;
    text-transform: capitalize;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90px;
  }
  .team img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    margin-bottom: 2px;
  }
  .team-name {
    font-size: 10px;
    color: #bbb;
    text-align: center;
    line-height: 1.2;
  }
  .score {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    min-width: 50px;
    text-align: center;
    letter-spacing: 2px;
  }
  .kickoff {
    font-size: 16px;
    font-weight: 600;
    color: #ccc;
    min-width: 50px;
    text-align: center;
  }
  .scorers {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 3px;
  }
  .scorers-side {
    font-size: 9px;
    color: #888;
    line-height: 1.4;
    max-width: 120px;
  }
  .scorers-home { text-align: right; }
  .scorers-away { text-align: left; }
  .separator {
    border: none;
    border-top: 1px solid #333;
    margin: 8px 40px;
  }
  .error { color: #c66; font-size: 11px; text-align: center; padding: 10px; }
  .loading { color: #666; font-size: 11px; text-align: center; padding: 10px; }
</style>
</head>
<body>
<div class="widget" id="widget">
  <div class="loading">Chargement…</div>
</div>
<script>
(function() {
  // ===== REMPLACEZ PAR VOTRE CLÉ API football-data.org =====
  var API_KEY = 'YOUR_API_KEY';
  // ==========================================================

  var TEAM_ID = 524;
  var BASE = 'https://api.football-data.org/v4';

  var JOURS = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
  var MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin',
              'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

  function formatDate(iso) {
    var d = new Date(iso);
    var paris = new Date(d.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
    return JOURS[paris.getDay()] + ' ' + paris.getDate() + ' ' + MOIS[paris.getMonth()];
  }

  function formatTime(iso) {
    var d = new Date(iso);
    var paris = new Date(d.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
    var h = paris.getHours();
    var m = paris.getMinutes();
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }

  function esc(s) {
    var el = document.createElement('span');
    el.textContent = s;
    return el.innerHTML;
  }

  function fetchJSON(url) {
    return fetch(url, {
      headers: { 'X-Auth-Token': API_KEY }
    }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function buildScorers(goals, teamId) {
    if (!goals || !goals.length) return '';
    var items = goals.filter(function(g) {
      return g.team && g.team.id === teamId && g.scorer;
    }).map(function(g) {
      var name = g.scorer.name.split(' ').pop();
      return esc(name) + (g.minute ? " <span style='color:#666'>" + g.minute + "'</span>" : '');
    });
    return items.join('<br>');
  }

  function render(last, next) {
    var html = '';

    if (last) {
      var m = last;
      html += '<div class="match">';
      html += '<div class="date">' + esc(formatDate(m.utcDate)) + '</div>';
      html += '<div class="row">';
      html += '<div class="team">';
      html += '<img src="' + esc(m.homeTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(m.homeTeam.shortName || m.homeTeam.name) + '</span>';
      html += '</div>';
      html += '<div class="score">' + m.score.fullTime.home + ' – ' + m.score.fullTime.away + '</div>';
      html += '<div class="team">';
      html += '<img src="' + esc(m.awayTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(m.awayTeam.shortName || m.awayTeam.name) + '</span>';
      html += '</div>';
      html += '</div>';

      var homeSc = buildScorers(m.goals, m.homeTeam.id);
      var awaySc = buildScorers(m.goals, m.awayTeam.id);
      if (homeSc || awaySc) {
        html += '<div class="scorers">';
        html += '<div class="scorers-side scorers-home">' + (homeSc || '&nbsp;') + '</div>';
        html += '<div class="scorers-side scorers-away">' + (awaySc || '&nbsp;') + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }

    if (last && next) {
      html += '<hr class="separator">';
    }

    if (next) {
      var n = next;
      html += '<div class="match">';
      html += '<div class="date">' + esc(formatDate(n.utcDate)) + '</div>';
      html += '<div class="row">';
      html += '<div class="team">';
      html += '<img src="' + esc(n.homeTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(n.homeTeam.shortName || n.homeTeam.name) + '</span>';
      html += '</div>';
      html += '<div class="kickoff">' + esc(formatTime(n.utcDate)) + '</div>';
      html += '<div class="team">';
      html += '<img src="' + esc(n.awayTeam.crest) + '" alt="">';
      html += '<span class="team-name">' + esc(n.awayTeam.shortName || n.awayTeam.name) + '</span>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
    }

    if (!last && !next) {
      html = '<div class="error">Aucune donnée disponible</div>';
    }

    document.getElementById('widget').innerHTML = html;
  }

  function loadData() {
    var lastUrl = BASE + '/teams/' + TEAM_ID + '/matches?status=FINISHED&limit=1';
    var nextUrl = BASE + '/teams/' + TEAM_ID + '/matches?status=SCHEDULED&limit=1';

    Promise.all([
      fetchJSON(lastUrl).catch(function() { return null; }),
      fetchJSON(nextUrl).catch(function() { return null; })
    ]).then(function(results) {
      var lastMatch = results[0] && results[0].matches && results[0].matches.length
        ? results[0].matches[results[0].matches.length - 1] : null;
      var nextMatch = results[1] && results[1].matches && results[1].matches.length
        ? results[1].matches[0] : null;
      render(lastMatch, nextMatch);
    }).catch(function() {
      document.getElementById('widget').innerHTML =
        '<div class="error">Erreur de chargement</div>';
    });
  }

  // Rafraîchissement à midi et minuit, heure de Paris
  function msUntilNextRefresh() {
    var now = new Date();
    var paris = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));
    var h = paris.getHours(), m = paris.getMinutes(), s = paris.getSeconds();
    var totalSec = h * 3600 + m * 60 + s;
    // Prochaine cible : midi (43200s) ou minuit (86400s)
    var targets = [0, 43200, 86400];
    var best = 86400;
    for (var i = 0; i < targets.length; i++) {
      var diff = targets[i] - totalSec;
      if (diff > 10 && diff < best) best = diff;
    }
    return best * 1000;
  }

  function scheduleRefresh() {
    var ms = msUntilNextRefresh();
    setTimeout(function() {
      loadData();
      scheduleRefresh();
    }, ms);
  }

  loadData();
  scheduleRefresh();
})();
</script>
</body>
</html>
